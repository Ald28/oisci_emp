version: "3.9"

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: oisci_emp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql://admin:admin@db:5432/oisci_emp"
      JWT_SECRET: supersecret
      JWT_EXPIRES: 1d
      PORT: 8000
    depends_on:
      - db
    command: >
      sh -c "
      npx prisma migrate deploy &&
      npx prisma db seed &&
      node src/server.js
      "

volumes:
  postgres_data: